<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tagespfad</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf3f1; color: #193b37; font-family: system-ui, sans-serif; }
    main { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    form { width: min(100%, 390px); padding: 32px; background: white; border-radius: 24px; box-shadow: 0 16px 50px #193b3712; }
    h1 { margin: 0 0 8px; } p { line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-weight: 600; }
    input, button { width: 100%; padding: 14px; border-radius: 10px; font: inherit; }
    input { border: 1px solid #8ca6a0; } button { border: 0; margin-top: 16px; background: #225c50; color: white; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .6; cursor: wait; } :focus-visible { outline: 3px solid #bb8322; outline-offset: 3px; }
    #status { min-height: 24px; margin-bottom: 0; } iframe { width: 100%; height: 100dvh; border: 0; display: block; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="login">
    <form id="form">
      <h1>Tagespfad</h1>
      <p>Dein Tag, Schritt für Schritt.</p>
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Tagespfad öffnen</button>
      <p id="status" role="status" aria-live="polite"></p>
      <noscript>Bitte aktiviere JavaScript, um Tagespfad zu öffnen.</noscript>
    </form>
  </main>
  <iframe id="app" title="Tagespfad Webapp" hidden allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
  <script src="login.js"></script>
</body>
</html>
